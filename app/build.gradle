plugins {
    id 'com.android.application'
}

android {
    namespace 'com.operit.onetimealarmcleaner'
    compileSdk 34

    defaultConfig {
        applicationId "com.operit.onetimealarmcleaner"
        minSdk 28
        targetSdk 34
        versionCode 8
        versionName "8.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // 不使用 resources.arsc 压缩，Xposed 模块依赖 assets/xposed_init
    androidResources {
        noCompress 'xposed_init'
    }
}

dependencies {
    // Xposed API（仅编译期，不打包）
    compileOnly 'de.robv.android.xposed:api:82'
}
